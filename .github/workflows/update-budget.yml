name: Update Travel Budget Data

on:
  schedule:
    - cron: '0 0 * * 1'   # 매주 월요일 00:00(UTC)에 자동 실행
  workflow_dispatch:        # "지금 바로 실행" 버튼도 생김

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-budget.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/budget.json
          git diff --staged --quiet || git commit -m "여행 예산 정보 자동 업데이트"
          git push